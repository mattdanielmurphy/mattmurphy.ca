<!doctype html>
<html lang="en" data-pal="aurora">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Slub logo</title>
<link rel="preload" href="/slub-logo/assets/DynaPuff-var-latin-BHdZ5rXB.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* DynaPuff by Toshi Omagari / Google, SIL Open Font License 1.1. Variable: wght 400-700, wdth 75-100. */
  @font-face {
    font-family: "DynaPuff";
    src: url("/slub-logo/assets/DynaPuff-var-latin-BHdZ5rXB.woff2") format("woff2");
    font-weight: 400 700;
    font-stretch: 75% 100%;
    font-display: block;
  }
  :root { color-scheme: light dark; --fb-bg: var(--bg); --fb-ink: var(--ink); --fb-muted: var(--soft); --fb-line: var(--line); --fb-soft: var(--chip); --fb-accent: var(--ink); --fb-accent-ink: var(--bg); --fb-font: system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; --ui: system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); overflow: hidden;
    font-family: var(--ui);   /* DynaPuff is for the wordmark only; everything around it stays plain */
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  /* One fixed shell with named rows and columns: nothing added to <body> from outside can move the logo's cell. */
  #app { position: fixed; inset: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr) auto; }
  #app > header { grid-area: 1 / 1; } #app > #stage { grid-area: 2 / 1; } #app > footer { grid-area: 3 / 1; }
  #app > #panel { grid-area: 1 / 2 / 4 / 3; }
  header { padding: 14px 18px 0; font-size: 13px; color: var(--soft); letter-spacing: .02em; display: flex; justify-content: space-between; gap: 12px; }
  #stage { position: relative; min-height: 0; min-width: 0; touch-action: none; cursor: crosshair; }
  /* Size is explicit: a viewport-unit default here, then exact pixels from fit() (font load, resize, Size slider). */
  #logo {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: block;
    width: min(52vw, calc((100dvh - 260px) * 1.3)); height: min(21.8vw, calc((100dvh - 260px) * .55));
    min-width: 120px; min-height: 50px; overflow: visible; pointer-events: none; opacity: 0; transition: opacity .5s ease;
  }
  #logo.ready { opacity: 1; }
  #logo text {
    font-family: "DynaPuff"; font-size: 300px; text-anchor: middle;
    stroke-linejoin: round; stroke-linecap: round; paint-order: stroke fill;
    pointer-events: none;
  }
  footer { padding: 0 16px calc(16px + env(safe-area-inset-bottom)); display: grid; justify-items: center; gap: 12px; }
  #axes { display: grid; grid-template-columns: repeat(4, 74px); gap: 4px; font-size: 12px; color: var(--soft); text-align: center; }
  #axes b { display: block; font-size: 15px; color: var(--ink); font-weight: 600; }
  #axes span { font-variant-numeric: tabular-nums; white-space: nowrap; }
  #hint { margin: 0; font-size: 14px; color: var(--soft); text-align: center; text-wrap: balance; }
  #pals, #tools { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; align-items: center; }
  .pill {
    font: inherit; font-size: 13px; color: var(--ink); background: transparent; border: 1.5px solid var(--line);
    border-radius: 999px; padding: 6px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px;
    transition: transform .08s ease, background-color .12s ease;
  }
  #pals .pill { padding-left: 9px; }
  .pill:active { transform: scale(.94); }
  .pill[aria-pressed="true"], .pill[aria-expanded="true"] { background: var(--chip); border-color: var(--ink); }
  .pill:focus-visible, #panel input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  #pals i { display: inline-flex; }
  #pals i s { width: 10px; height: 10px; border-radius: 50%; margin-left: -3px; }
  #pals i s:first-child { margin-left: 0; }
  #measure { position: absolute; left: -9999px; top: 0; font-family: "DynaPuff"; font-size: 300px; line-height: 1; white-space: nowrap; visibility: hidden; }

  /* ---------- sliders panel: a column beside the logo (below it on a phone); the logo re-fits to what's left ---------- */
  #panel { width: 316px; overflow-y: auto; overscroll-behavior: contain; border-left: 1.5px solid var(--line); padding: 14px 16px calc(20px + env(safe-area-inset-bottom)); font-size: 13px; }
  #panel[hidden] { display: none; }
  #panel .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
  #panel h1 { font-size: 17px; font-weight: 650; margin: 0; letter-spacing: -.01em; }
  #panel h2 { font-size: 13px; font-weight: 650; margin: 20px 0 2px; }
  #panel p { margin: 0 0 8px; color: var(--soft); font-size: 12px; text-wrap: pretty; }
  #panel .acts { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 0; }
  #panel .pill { font-size: 12px; padding: 5px 10px; }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; column-gap: 6px; padding: 5px 0 1px; }
  .row label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row output { color: var(--soft); font-variant-numeric: tabular-nums; min-width: 34px; text-align: right; }
  .row .undo { font: inherit; font-size: 13px; line-height: 1; width: 22px; height: 22px; border-radius: 50%; border: 0; background: var(--chip); color: var(--ink); cursor: pointer; visibility: hidden; padding: 0; }
  .row.changed .undo { visibility: visible; }
  .row.changed output { color: var(--ink); }
  .row .undo:active { transform: scale(.88); }
  .row input { grid-column: 1 / -1; width: 100%; margin: 3px 0 4px; accent-color: var(--ink); cursor: pointer; }
  @media (max-width: 760px) {
    #app { grid-template-rows: auto minmax(0, 1fr) auto auto; grid-template-columns: minmax(0, 1fr); }
    #app > #panel { grid-area: 4 / 1; width: auto; max-height: 44dvh; border-left: 0; border-top: 1.5px solid var(--line); }
    footer { gap: 8px; padding-bottom: 10px; }
  }
</style>
  <script type="module" crossorigin src="/slub-logo/assets/index-Ci0H6Kl4.js"></script>
  <link rel="stylesheet" crossorigin href="/slub-logo/assets/index-AfHH4R-m.css">
</head>
<body>
<div id="app">
<header><span>Slub, living wordmark test</span><span>DynaPuff variable font</span></header>

<main id="stage" aria-label="Slub">
  <svg id="logo" viewBox="100 62 800 336" role="img" aria-label="Slub"></svg>
</main>

<footer>
  <div id="axes" aria-hidden="true"></div>
  <p id="hint">Move your cursor over&nbsp;it.</p>
  <div id="pals" role="group" aria-label="Palette"></div>
  <div id="tools"><button class="pill" id="open" type="button" aria-expanded="false" aria-controls="panel">Sliders</button><span id="fbslot"></span></div>
</footer>

<aside id="panel" aria-label="Sliders" hidden>
  <div class="head"><h1>Dial it in</h1><button class="pill" id="close" type="button">Close</button></div>
  <p>Every slider is live and remembered on this device. The round arrow puts one back.</p>
  <div id="rows"></div>
  <div class="acts"><button class="pill" id="copy" type="button">Copy settings</button><button class="pill" id="reset" type="button">Reset all</button></div>
</aside>
</div>
<span id="measure" aria-hidden="true"></span>

</body>
</html>
